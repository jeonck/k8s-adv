<header class="header">
  <div class="container">
    <a class="logo" href="{{ "/" | relURL }}">K8s 심화 과정</a>
    <nav class="nav">
      <ul class="nav-menu">
        {{ $cur := . }}
        {{ range site.Home.Sections.ByWeight }}
        <li><a href="{{ .RelPermalink }}" class="nav-link{{ if or (eq $cur.RelPermalink .RelPermalink) ($cur.InSection .) }} active{{ end }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
