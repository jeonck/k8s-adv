baseURL = "/"
title = "K8s 심화 과정"
theme = "hextra"
defaultContentLanguage = "ko"
locale = "ko"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.footer]
    displayCopyright = true
    displayPoweredBy = true
  [params.search]
    enable = true
    type = "flexsearch"
  [params.theme]
    default = "system"
    displayToggle = true

[[menus.main]]
  name = "검색"
  weight = 100
  [menus.main.params]
    type = "search"

[[menus.main]]
  name = "소개"
  pageRef = "/intro"
  weight = 1

[[menus.main]]
  name = "실습 환경"
  pageRef = "/lab-env"
  weight = 2

[[menus.main]]
  name = "기초 이론"
  pageRef = "/basics"
  weight = 3

[[menus.main]]
  name = "인증/보안"
  pageRef = "/security"
  weight = 4

[[menus.main]]
  name = "Operator"
  pageRef = "/operator"
  weight = 5

[[menus.main]]
